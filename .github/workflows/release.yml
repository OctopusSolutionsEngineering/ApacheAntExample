name: Release

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: echo "timestamp=$(date -u +'%Y.%m.%d.%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Package source
        run: git archive --format=zip --output="antdemo.${{ steps.version.outputs.timestamp }}.zip" "$GITHUB_SHA"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.timestamp }}
        run: |
          gh release create "$VERSION" "antdemo.$VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "antdemo $VERSION" \
            --notes "Source code for commit $GITHUB_SHA on $GITHUB_REF_NAME."
